services:
  meet:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    command: ["node", "node_modules/next/dist/bin/next", "start", "-p", "3000"]
    networks:
      - meet-net

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - meet
    environment:
      - CADDY_HOST=${CADDY_HOST:-localhost}
    ports:
      - "8085:80"
      - "8445:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - meet-net

networks:
  meet-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
